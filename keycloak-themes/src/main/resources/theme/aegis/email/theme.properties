# Aegis email theme.
# html/ emails are our own layouts; text/ emails use Keycloak's templates
# with Aegis wording from messages/messages_en.properties.
parent=base
locales=en

# Public HTTPS URL of the PNG logo shown at the top of every email
# (branding/email-logo.png in this repo, uploaded somewhere public).
# Email apps don't load SVG or files from inside Keycloak, so this must be
# an absolute https:// URL. Leave empty to show a text wordmark instead.
logoUrl=https://raw.githubusercontent.com/Oluwatodimu/aegis-frontend/main/public/email-logo.png

# Shown in the email footer.
aegisCompanyAddress=[YOUR POSTAL ADDRESS]

# Where the "Sign in to secure your account" button in security alert emails
# points (e.g. the Aegis app's sign-in page). Leave empty to hide the button.
aegisSignInUrl=
