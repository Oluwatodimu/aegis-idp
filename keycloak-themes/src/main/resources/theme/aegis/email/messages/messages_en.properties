aegisEventTotpOffIfNot=Didn’t do this? Reset your password now and contact your organization’s administrator.
eventRemoveTotpBody=Two-step verification was removed from your Aegis account on {0} from {1}.\n\nDidn’t do this? Reset your password now and contact your organization’s administrator.

# UPDATE_CREDENTIAL / REMOVE_CREDENTIAL (Keycloak 26+). The HTML picks its wording
# from the credential type (password, otp, recovery codes); the subject can’t, so it
# stays general. Plain-text bodies: {0} credential type, {1} date, {2} IP address.
eventUpdateCredentialSubject=Your Aegis sign-in details were changed
eventUpdateCredentialBody=A sign-in method ({0}) on your Aegis account was changed on {1} from {2}.\n\nIf this wasn’t you, reset your password right away and tell your organization’s administrator.
eventRemoveCredentialSubject=A sign-in method was removed from your Aegis account
eventRemoveCredentialBody=A sign-in method ({0}) was removed from your Aegis account on {1} from {2}.\n\nIf this wasn’t you, reset your password now and tell your organization’s administrator.

aegisEventRecoveryCodesPreheader=New recovery codes were created for your account.
aegisEventRecoveryCodesHeading=New recovery codes were created
