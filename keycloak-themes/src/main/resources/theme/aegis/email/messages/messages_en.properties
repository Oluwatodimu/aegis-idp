# Aegis email theme — English wording.
# Only keys we change are here; everything else comes from the base theme.
# Messages are formatted with Java MessageFormat: ’ (’) is used instead of
# a plain apostrophe, which would need to be doubled ('').

# ---- Shared ----------------------------------------------------------------
aegisEmailFooter=You’re receiving this email because of activity on your Aegis account.
aegisEmailButtonFallback=Button not working? Paste this link into your browser:
aegisLinkExpires=This link expires in {0}.

requiredAction.VERIFY_EMAIL=Verify your email
requiredAction.UPDATE_PASSWORD=Create a password
requiredAction.CONFIGURE_TOTP=Set up two-step verification
requiredAction.CONFIGURE_RECOVERY_AUTHN_CODES=Save your backup codes
requiredAction.UPDATE_PROFILE=Confirm your details
requiredAction.TERMS_AND_CONDITIONS=Accept the terms

# ---- executeActions (sign-up via the Aegis API, or admin-requested actions) --
executeActionsSubject=Finish setting up your Aegis account
aegisSetupPreheader=Confirm your email and finish setting up your account.
aegisSetupHeading=Welcome to Aegis
aegisSetupHeadingName=Welcome to Aegis, {0}
aegisSetupIntro=Confirm your email and finish setting up your account. Here’s what you’ll do:
aegisSetupButton=Finish setup
aegisSetupIgnore=Didn’t sign up for Aegis? Ignore this email — no account is activated without it.
aegisActionsPreheader=Your administrator asked you to update your Aegis account.
aegisActionsHeading=Action needed on your account
aegisActionsIntro=Your organization’s administrator asked you to complete the following on your Aegis account:
aegisActionsButton=Get started
aegisActionsIgnore=Not expecting this? Check with your organization’s administrator before using the link.
# Plain-text version: {0} link, {2} realm, {3} actions, {4} expiry
executeActionsBody=Finish setting up your Aegis account\n\nComplete these steps: {3}.\n\nOpen this link to continue:\n{0}\n\nThis link expires in {4}.\n\nNot expecting this email? Ignore it — nothing changes without the link.

# ---- password-reset --------------------------------------------------------
passwordResetSubject=Reset your Aegis password
aegisResetPreheader=Use this link to choose a new password.
aegisResetHeading=Reset your password
aegisResetIntro=We received a request to reset your Aegis password.
aegisResetIntroEmail=We received a request to reset the password for {0}.
aegisResetButton=Choose a new password
aegisResetExpires=This link expires in {0} and works once.
aegisResetIgnore=Didn’t ask for this? Ignore this email — your password stays the same.
# Plain-text version: {0} link, {3} expiry
passwordResetBody=Reset your Aegis password\n\nWe received a request to reset your password. Open this link to choose a new one:\n{0}\n\nThis link expires in {3} and works once.\n\nDidn’t ask for this? Ignore this email — your password stays the same.

# ---- Security alerts (email event listener) --------------------------------
aegisEventWhen=When
aegisEventIp=IP address
aegisEventSignIn=Sign in to secure your account
aegisEventFooter=Security alerts are sent for important account activity and can’t be turned off.

eventLoginErrorSubject=Failed sign-in to your Aegis account
aegisEventLoginErrorPreheader=Someone couldn’t sign in to your account.
aegisEventLoginErrorHeading=Someone couldn’t sign in to your account
aegisEventLoginErrorIntro=A sign-in to your Aegis account failed.
aegisEventLoginErrorIfYou=If this was you, you can ignore this email.
aegisEventLoginErrorIfNot=If it wasn’t, reset your password from the sign-in page and tell your organization’s administrator.
# Plain-text: {0} date, {1} IP
eventLoginErrorBody=A sign-in to your Aegis account failed on {0} from {1}.\n\nIf this was you, ignore this email. If it wasn’t, reset your password and tell your organization’s administrator.

eventUpdatePasswordSubject=Your Aegis password was changed
aegisEventPasswordPreheader=Your password was just changed.
aegisEventPasswordHeading=Your password was changed
aegisEventPasswordIntro=The password for your Aegis account was changed.
aegisEventPasswordIfYou=If this was you, there’s nothing else to do.
aegisEventPasswordIfNot=If it wasn’t, reset your password right away and tell your organization’s administrator.
eventUpdatePasswordBody=Your Aegis password was changed on {0} from {1}.\n\nIf this wasn’t you, reset your password right away and tell your organization’s administrator.

eventUpdateTotpSubject=Two-step verification was set up
aegisEventTotpOnPreheader=An authenticator app was added to your account.
aegisEventTotpOnHeading=Two-step verification is on
aegisEventTotpOnIntro=An authenticator app was added to your Aegis account. You’ll be asked for a code when you sign in.
aegisEventTotpOnIfYou=If this was you, there’s nothing else to do.
aegisEventTotpOnIfNot=Didn’t do this? Reset your password and contact your organization’s administrator.
eventUpdateTotpBody=An authenticator app was added to your Aegis account on {0} from {1}.\n\nDidn’t do this? Reset your password and contact your organization’s administrator.

eventRemoveTotpSubject=Two-step verification was removed
aegisEventTotpOffPreheader=Your account no longer asks for a code at sign-in.
aegisEventTotpOffHeading=Two-step verification was removed
aegisEventTotpOffIntro=Your Aegis account no longer asks for a code at sign-in. If your organization requires it, you’ll be asked to set it up again next time.
