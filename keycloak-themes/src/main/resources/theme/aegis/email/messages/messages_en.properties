aegisEventRecoveryCodesIfYou=If this was you, keep the new codes somewhere safe.
aegisEventRecoveryCodesIfNot=Didn’t do this? Reset your password and contact your organization’s administrator.

aegisEventCredentialUpdatedPreheader=A sign-in method on your account was changed.
