# Aegis login theme.
# Built on keycloak.v2 with our own template.ftl (split-screen layout for every page),
# styled by css/aegis.css. Overridden templates: login.ftl, login-otp.ftl,
# login-config-totp.ftl, info.ftl, template.ftl.

parent=keycloak.v2
locales=en

# styles= replaces the parent's list, so keep keycloak.v2's stylesheet first.
styles=css/styles.css css/aegis.css

# Follow the device's light/dark setting (keycloak.v2 adds .pf-v5-theme-dark).
darkMode=true

# ---- Aegis settings (read by our templates) --------------------------------

# Where "Create an account" on the sign-in page points (the Aegis app's sign-up page).
# Leave empty to hide the link. Registration itself stays OFF in the realm.
aegisSignupUrl=

# Fallback for the "Continue to Aegis" button on info pages, used only when
# Keycloak has no redirect URI and the client has no base URL.
aegisAppUrl=
